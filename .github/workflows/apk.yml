# https://github.com/marketplace/actions/automated-build-android-app-with-github-action
# https://github.com/marketplace/actions/publish-release

name: Generate APK

env:
  main_project_module: app
  target_owner: Xposed-Modules-Repo
  target_repo: io.github.yoyosuharyo.gpssetter
  target_path: target_path

permissions:
  contents: write   # required by softprops/action-gh-release with GITHUB_TOKEN

on:
  push:
    branches:
      - 'release/**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'v*.*.*'
        required: true
        type: string
  # schedule:
  #   - cron: '0 0 1 */2 *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set TAG
        if: github.event_name == 'push'
        run: |
          echo "version=$(echo '${{ github.ref_name }}' | awk -F 'v' '{print $2}')" >> $GITHUB_ENV

      - name: Set TAG
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "version=$(echo '${{ inputs.version }}' | awk -F 'v' '{print $2}')" >> $GITHUB_ENV

      - name: Set ENV
        run: | 
          echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV;
          echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      - name: Use JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17' # 21
          cache: 'gradle'

      - name: Build
        env:
          STORE: ${{ secrets.STORE }}
          LOCAL: ${{ secrets.LOCAL }}
        run: |
          set -euo pipefail
          trap 'rm -f upload.jks signing.properties' EXIT
          if [ -n "$STORE" ] && [ -n "$LOCAL" ]; then
            printf '%s' "$STORE" | base64 --decode > upload.jks
            printf '%s' "$LOCAL" | base64 --decode > signing.properties
          else
            echo "::warning::Secrets STORE/LOCAL are not set. Signing with a throw-away keystore generated in this run. Each build then has a different signature, so uninstall the old APK before installing a new one."
            PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore upload.jks -storetype PKCS12 \
              -alias gpssetter -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=GPS Setter, O=Local build, C=ID"
            {
              echo "keyAlias=gpssetter"
              echo "keyPassword=$PASS"
              echo "storeFile=$GITHUB_WORKSPACE/upload.jks"
              echo "storePassword=$PASS"
            } > signing.properties
          fi
          chmod +x ./gradlew
          status=0
          ./gradlew :app:assembleFossRelease :app:assembleFullRelease --stacktrace --console=plain 2>&1 \
            | tee gradle-build.log || status=$?
          if [ "$status" -ne 0 ]; then
            # Put the real cause into the run's Annotations, not just "exit code 1".
            {
              grep -E '^e: |error: |AAPT: error|Could not (resolve|GET|find)|OutOfMemoryError|Java heap space|Metaspace|daemon disappeared' gradle-build.log | sort -u | head -15
              sed -n '/What went wrong/,/^\* Try/p' gradle-build.log | head -15
            } > gradle-summary.txt || true
            summary="$(head -c 3000 gradle-summary.txt)"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            summary="${summary//$'\n'/'%0A'}"
            echo "::error title=Gradle build failed (exit ${status})::${summary}"
            exit "$status"
          fi

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v5
        with:
          name: gps-setter-apk
          path: ${{ env.main_project_module }}/build/outputs/apk/*/release/*.apk
          if-no-files-found: error

      # - name: Upload
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: ${{ env.repository_name }} - ${{ env.date_today }}
      #     path: ${{ env.main_project_module }}/build/outputs/apk/

      - name: Publish (GitHub)
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.version }}
          tag_name: v${{ env.version }}
          body: |
            ## Changes
            - Spoof the cached last location and the location handed to a listener on registration, so apps no longer briefly see the real position when opening a map.
            - Spoof locations at the final system delivery step, covering all listeners and PendingIntents.
            - Spoof Location parcels leaving hooked processes (e.g. Google Play Services to apps).
            - In spoofed apps, hide Wi-Fi scan results and cell tower info so map SDKs cannot locate the device by radio signals.

            ## Изменения
            - Подмена кэшированной последней геопозиции и геопозиции, выдаваемой слушателю при регистрации: приложения больше не видят реальное место при открытии карты.
            - Подмена геопозиции на последнем шаге системной доставки (все слушатели и PendingIntent).
            - Подмена Location при передаче между процессами (например, из сервисов Google Play в приложения).
            - В приложениях с подменой скрываются результаты сканирования Wi-Fi и данные сотовых вышек, чтобы SDK карт не определяли место по радиосигналам.
          files: |
            ${{ env.main_project_module }}/build/outputs/apk/foss/release/app-foss-arm64-v8a-release.apk
            ${{ env.main_project_module }}/build/outputs/apk/full/release/app-full-arm64-v8a-release.apk

      - name: Publish (Xposed)
        if: vars.LSPOSED_REPO_READY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PAT }}
          repository: Xposed-Modules-Repo/io.github.yoyosuharyo.gpssetter
          name: v${{ env.version }}
          tag_name: v${{ env.version }}
          body: |
            ## Changes
            - Spoof the cached last location and the location handed to a listener on registration, so apps no longer briefly see the real position when opening a map.
            - Spoof locations at the final system delivery step, covering all listeners and PendingIntents.
            - Spoof Location parcels leaving hooked processes (e.g. Google Play Services to apps).
            - In spoofed apps, hide Wi-Fi scan results and cell tower info so map SDKs cannot locate the device by radio signals.

            ## Изменения
            - Подмена кэшированной последней геопозиции и геопозиции, выдаваемой слушателю при регистрации: приложения больше не видят реальное место при открытии карты.
            - Подмена геопозиции на последнем шаге системной доставки (все слушатели и PendingIntent).
            - Подмена Location при передаче между процессами (например, из сервисов Google Play в приложения).
            - В приложениях с подменой скрываются результаты сканирования Wi-Fi и данные сотовых вышек, чтобы SDK карт не определяли место по радиосигналам.
          files: |
            ${{ env.main_project_module }}/build/outputs/apk/foss/release/app-foss-arm64-v8a-release.apk
            ${{ env.main_project_module }}/build/outputs/apk/full/release/app-full-arm64-v8a-release.apk

      - name: Checkout
        if: vars.LSPOSED_REPO_READY == 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.target_owner }}/${{ env.target_repo }}
          path: ${{ env.target_path }}
          token: ${{ secrets.PAT }}
          # sparse-checkout: |
          #     README.md
          # sparse-checkout-cone-mode: false
      
      - name: Sync
        if: vars.LSPOSED_REPO_READY == 'true'
        run: |
          cd ${{ env.target_path }}
          cp ../README.md ../README.ru.md ../LICENSE .
          printf '%s\n' "https://github.com/${GITHUB_REPOSITORY}" > SOURCE_URL
          printf '%s\n' "Voice-switch saved locations from Quick Settings; spoof GPS system-wide or per app." > SUMMARY
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md README.ru.md LICENSE SOURCE_URL SUMMARY
          git commit --amend --no-edit
          git push --force
      
